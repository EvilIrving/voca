name: Parley
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
options:
  bundleIdPrefix: com.parley
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: QZZ878S3NS
    PRODUCT_BUNDLE_IDENTIFIER: com.parley.speaker
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  Parley:
    type: application
    platform: iOS
    sources:
      - path: Parley
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parley.speaker
        PRODUCT_NAME: Parley
        INFOPLIST_FILE: Parley/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Parley/Parley.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_EMIT_LOC_STRINGS: false
    entitlements:
      path: Parley/Parley.entitlements
    info:
      path: Parley/Info.plist
      properties:
        CFBundleDisplayName: Parley
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: 需要麦克风权限才能练习口语
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Lottie
        product: Lottie
    preBuildScripts:
      - name: Load secrets
        basedOnDependencyAnalysis: false
        script: |
          python3 "${SRCROOT}/../tools/ios-secrets.py"
